; Coffee Timer – Pumpenerkennung für Siebträger-Kaffeemaschinen
; Hardware: M5Stack CoreS3 (ESP32-S3, 16 MB Flash, 8 MB PSRAM, ES7210 Mikrofon)
;
; Dokumentation: https://docs.platformio.org/page/projectconf.html

[platformio]
; Standard: Flashen per USB. Für WLAN-Update: -e m5stack-cores3-ota
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; 16 MB Flash mit zwei App-Slots à 6,4 MB (nötig für OTA-Updates)
board_build.partitions = default_16MB.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    ; Texte in JSON bis 4 GB statt 64 kB – die KI-Trainingsdaten im Export sind ~90 kB groß
    -DARDUINOJSON_STRING_LENGTH_SIZE=4
build_unflags =
    -std=gnu++11

lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
    ; Bluetooth LE für die optionale Felicita-Arc-Waage (sparsamer als der Standard-Stack)
    h2zero/NimBLE-Arduino@^1.4.3

; Firmware-Update über WLAN (ArduinoOTA) statt USB:
;   pio run -e m5stack-cores3-ota -t upload
;
; upload_port:
;   - gleiches Netz wie der PC: coffeetimer.local oder die IP vom Display
;   - CoreS3 hinter einem zweiten Router: dessen WAN-IP (die Adresse des Routers
;     im Netz des PCs) und im Router eine Portweiterleitung UDP 3232 -> CoreS3
; Ablauf: Der PC lädt den CoreS3 per UDP 3232 ein, der CoreS3 verbindet sich
; dann per TCP zurück zum PC auf host_port. Diesen Port ggf. in der
; macOS-Firewall erlauben (Systemeinstellungen -> Netzwerk -> Firewall).
[env:m5stack-cores3-ota]
extends = env:m5stack-cores3
upload_protocol = espota
upload_port = coffeetimer.local  ; oder die IP aus der Kopfzeile des Displays
upload_flags =
    --host_port=8266
